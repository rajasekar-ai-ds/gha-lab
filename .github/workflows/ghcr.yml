name: ghcr
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: docker build -t ghcr.io/rajasekar-ai-ds/gha-app:latest -t ghcr.io/rajasekar-ai-ds/gha-app:${{ github.sha }} .

      - name: Push the Images to ghcr
        run: |
          docker push ghcr.io/rajasekar-ai-ds/gha-app:latest
          docker push ghcr.io/rajasekar-ai-ds/gha-app:${{ github.sha }}
          
