name: artifacts-lab

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of training epochs"
        required: true
        default: "5"
        type: string
jobs:
  train:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    outputs:
      model_version: ${{ steps.score.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set-up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements-pyX.lock

#      - name: Cache pip downloads
#        uses: actions/cache@v4
#        with:
#          path: ~/.cache/pip
#          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{hashFiles(format('requirements-py{0}.lock', matrix.python-version))}}
#          restore-keys: |
#            pip-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install Packages
        run: python -m pip install -r requirements-py${{ matrix.python-version }}.lock

#      - name: Freeze exact environment
#        run: python -m pip freeze > requirements-py${{ matrix.python-version }}.lock

      - name: Upload lock file
        uses: actions/upload-artifact@v4
        with:
          name: lock-${{ matrix.python-version }}
          path: requirements-py${{ matrix.python-version }}.lock

      - name: Running train.py
        id: score
        env:
          EPOCHS: ${{ inputs.epochs }}
        run: python3 train.py
      
      - name: Upload the model
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ matrix.python-version }}
          path: model.json

  build:
    runs-on: ubuntu-latest
    needs: train
    steps: 
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: model-*
      - name: List the files
        run: ls -R
      - name: Read the content of the model
        run: head model-*/model.json
      - run: echo "Version is ${{ needs.train.outputs.model_version }}"
