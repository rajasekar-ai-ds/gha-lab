name: artifacts-lab

on:
  push:
    branches:
      - main

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Running train.py
        run: python3 train.py
      
      - name: Upload the model
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: model.json 
  build:
    runs-on: ubuntu-latest
    needs: train
    steps: 
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: model
      - name: List the files
        run: ls -la 
      - name: Read the content of the model
        run: cat model.json
