name: artifacts-lab

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of training epochs"
        required: true
        default: "5"
        type: string
jobs:
  train:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]
    outputs:
      model_version: ${{ steps.score.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set-up Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Running train.py
        id: score
        env:
          EPOCHS: ${{ inputs.epochs }}
        run: python3 train.py
      
      - name: Upload the model
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ matrix.python-version }}
          path: model.json

  build:
    runs-on: ubuntu-latest
    needs: train
    steps: 
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: model-*
      - name: List the files
        run: ls -R
      - name: Read the content of the model
        run: head model-*/model.json
      - run: echo "Version is ${{ needs.train.outputs.model_version }}"
