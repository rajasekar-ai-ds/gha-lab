name: artifacts-lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      epochs:
        description: "Number of training epochs"
        required: true
        default: "5"
        type: string
jobs:
  train:

    runs-on: ubuntu-latest
    outputs:
      model_version: ${{ steps.score.outputs.version }}
    steps:
      - name: Train
        env:
          EPOCHS: ${{ inputs.epochs }}
        run: python3 train.py
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Running train.py
        run: python3 train.py
        id: score
      
      - name: Upload the model
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: model.json
#      - id: score
#        run: python3 train.py
  build:
    runs-on: ubuntu-latest
    needs: train
    steps: 
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: model
      - name: List the files
        run: ls -la 
      - name: Read the content of the model
        run: cat model.json
      - run: echo "Version is ${{ needs.train.outputs.model_version }}"
